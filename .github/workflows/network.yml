name: Tests de red

# Comprueban los checks contra webs y DNS reales (badssl.com, google.com,
# github.com). Van aparte del CI porque dependen de servicios ajenos: si una
# de esas webs cambia o se cae, este job puede fallar sin que haya un bug.
on:
  pull_request:
  # También en cada subida a main: allí se publica directamente en Vercel.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # lunes a las 06:00 UTC

permissions:
  contents: read

concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network:
    name: Tests contra webs reales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de red
        run: npm run test:network
